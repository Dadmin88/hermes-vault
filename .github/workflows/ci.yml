name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' build

      - name: Check whitespace
        run: git diff --check

      - name: Run tests
        run: python -m pytest -q

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Build package
        run: python -m build

      - name: Clean-install wheel smoke
        run: |
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip install --quiet dist/*.whl
          "$RUNNER_TEMP/wheel-smoke/bin/hermes-vault" --help >/dev/null
          "$RUNNER_TEMP/wheel-smoke/bin/python" - <<'PY'
          from hermes_secure_store import VaultStore, ScopeRef, InjectionTarget
          assert VaultStore and ScopeRef and InjectionTarget
          PY
